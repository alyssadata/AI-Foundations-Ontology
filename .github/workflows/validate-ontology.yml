name: Validate AI Foundations Ontology v1

on:
  push:
    paths:
      - 'ontology/ai-foundations-v1.ttl'
      - 'ontology/ai-foundations-v1-shapes.ttl'
      - 'tests/validate_ontology_v1.py'
      - 'tests/validate_succession_gate.py'
      - 'tests/validate_initial_operator_gate.py'
      - 'tests/validate_autonomy_gate.py'
      - 'tests/validate_refusal_outcomes.py'
      - 'tests/validate_cq01_instantiation.py'
      - '.github/workflows/validate-ontology.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out ontology
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RDF and SHACL validation libraries
        run: python -m pip install 'rdflib>=7,<8' 'pyshacl>=0.30,<1'
      - name: Validate CQ01 distinct AI instantiation through Model and Container
        run: python tests/validate_cq01_instantiation.py
      - name: Validate refused succession and autonomy-dependent line outcomes
        run: python tests/validate_refusal_outcomes.py
      - name: Validate evidence-qualified autonomous/self-recursive state gate
        run: python tests/validate_autonomy_gate.py
      - name: Validate initial S00 mutual Operator assent gate
        run: python tests/validate_initial_operator_gate.py
      - name: Validate four-condition Operator succession admission gate
        run: python tests/validate_succession_gate.py
      - name: Validate source-bound ontology and negative fixtures
        run: python tests/validate_ontology_v1.py
